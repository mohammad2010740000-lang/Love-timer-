<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>us, still.</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 45%, #24133d 0%, #100b18 35%, #07070a 70%);
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.container {
    text-align: center;
    width: 90%;
    max-width: 600px;
}

.small {
    color: #a99ab8;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 25px;
}

.title {
    font-size: 24px;
    font-weight: 400;
    margin-bottom: 35px;
}

.timer {
    font-family: 'Orbitron', sans-serif;
    font-size: 42px;
    font-weight: 700;

    color: #ffffff;

    text-shadow:
        0 0 8px #c77dff,
        0 0 20px #9d4edd,
        0 0 40px rgba(157, 78, 221, 0.5);

    margin-bottom: 18px;
}

.labels {
    color: #8f819c;
    font-size: 11px;
    letter-spacing: 3px;
    margin-bottom: 35px;
}

.since {
    color: #75687e;
    font-size: 12px;
    letter-spacing: 2px;
}

.dot {
    width: 6px;
    height: 6px;
    background: #c77dff;
    border-radius: 50%;

    margin: 0 auto 25px;

    box-shadow:
        0 0 10px #c77dff,
        0 0 25px #9d4edd;
}

</style>
</head>

<body>

<div class="container">

    <div class="dot"></div>

    <div class="small">
        our little timeline
    </div>

    <div class="title">
        us, still.
    </div>

    <div class="timer" id="timer">
        00Y 00M 00D
    </div>

    <div class="labels">
        YEARS&nbsp;&nbsp;&nbsp; MONTHS&nbsp;&nbsp;&nbsp; DAYS
    </div>

    <div class="since">
        since 1 tir 1404
    </div>

</div>

<script>

const startDate = new Date("2025-06-22T00:00:00");

function updateTimer() {

    const now = new Date();

    let years = now.getFullYear() - startDate.getFullYear();
    let months = now.getMonth() - startDate.getMonth();
    let days = now.getDate() - startDate.getDate();

    if (days < 0) {
        months--;
        const previousMonth = new Date(
            now.getFullYear(),
            now.getMonth(),
            0
        );
        days += previousMonth.getDate();
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    document.getElementById("timer").innerHTML =
        String(years).padStart(2, "0") + "Y " +
        String(months).padStart(2, "0") + "M " +
        String(days).padStart(2, "0") + "D";
}

updateTimer();

setInterval(updateTimer, 1000);

</script>

</body>
</html>
